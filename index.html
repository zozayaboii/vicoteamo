<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felices 19, Vieja</title>
  <meta property="og:title" content="Felices 19 :3" />
  <meta property="og:description" content="Hecho especialmente para vos." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="script.js?v=4" defer></script>
</head>
<body>
  <div class="fondo-luces" aria-hidden="true"></div>

  <main class="contenedor">
    <header class="hero">
      <span class="etiqueta-comic" id="subtitulo-hero"></span>
      <h1 id="titulo-hero"></h1>
      <div class="separador-arte">
        <span></span><i></i><span></span>
      </div>
    </header>

    <section class="tarjeta-principal">
      <div id="carta-principal" class="texto-carta"></div>
    </section>

    <section class="bloque">
      <h2>Cartas para abrir cuando...</h2>
      <p class="bajada">Tocá cada sobre en el momento en que lo necesites.</p>
      <div id="sobres-grid" class="grid-sobres"></div>
    </section>

    <section class="bloque">
      <h2>Una playlist con mensaje oculto</h2>
      <p id="pista-playlist" class="pista"></p>
      <div class="marco-spotify">
        <iframe
          id="spotify-frame"
          width="100%"
          height="660"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>
    </section>

    <section class="bloque">
      <h2>Rincón de bocetos</h2>
      <p class="bajada">Hacé un dibujo rápido con el dedo, descargalo y mandamelo :3.</p>
      <div class="bloc-caja">
        <div class="bloc-herramientas">
          <button type="button" class="color-btn activo" data-color="#1b1e2e" aria-label="Tinta oscura" style="background:#1b1e2e"></button>
          <button type="button" class="color-btn" data-color="#e05286" aria-label="Rosa" style="background:#e05286"></button>
          <button type="button" class="color-btn" data-color="#2b8cd6" aria-label="Azul" style="background:#2b8cd6"></button>
          <button type="button" class="color-btn" data-color="#279665" aria-label="Verde" style="background:#279665"></button>
          <button type="button" id="btn-goma" class="accion-bloc">Goma</button>
          <button type="button" id="btn-limpiar" class="accion-bloc">Borrar todo</button>
        </div>
        <canvas id="lienzo-dibujo"></canvas>
        <button type="button" id="btn-descargar" class="btn-descargar">Descargar dibujo</button>
      </div>
    </section>
    <footer class="cierre-web">
      <p>Hecho especialmente para vos :3.</p>
      <span>Feliz vuelta al sol gordi, AHRE LALCYAKDJSKDJJSD</span>
    </footer>
    
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-caja">
      <button id="cerrar-modal" class="btn-cerrar" aria-label="Cerrar">Cerrar</button>
      <span id="modal-etiqueta" class="etiqueta-comic"></span>
      <h3 id="modal-titulo"></h3>
      <div id="modal-texto" class="texto-carta"></div>
    </div>
  </div>

  <canvas id="lienzo-festejo" aria-hidden="true"></canvas>
  <button type="button" id="btn-festejo" class="btn-festejo">Tirar notas</button>
</body>
</html>
